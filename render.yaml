# Render Blueprint. Apply from a Git repo Render can clone (GitHub, GitLab, or
# Bitbucket). Free web service, Node 22, Singapore (closest Render region to
# mainland China). Neon supplies DATABASE_URL; this file does not create it.
services:
  - type: web
    name: stylemate-ai
    runtime: node
    plan: free
    region: singapore
    branch: render
    # Render does not install dependencies when buildCommand is set. npm ci
    # matches package-lock.json; --include=dev keeps Vite and the rest of the
    # toolchain when NODE_ENV=production would omit devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    # npm start migrates, then listens on 0.0.0.0 and Render's PORT.
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # npm ci deletes node_modules first. A restored module cache can make that fail.
      - key: NODE_MODULES_CACHE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
